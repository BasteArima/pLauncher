<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1280px;height:640px;overflow:hidden;background:#0b0918;font-family:'Segoe UI',sans-serif}
.bg{position:absolute;inset:0;background:
 radial-gradient(700px 500px at 15% 20%,rgba(99,102,241,.35),transparent 60%),
 radial-gradient(700px 520px at 85% 90%,rgba(217,70,239,.30),transparent 60%),
 radial-gradient(500px 400px at 60% 10%,rgba(56,189,248,.12),transparent 60%),#0b0918}
.left{position:absolute;left:84px;top:150px;width:520px}
.icon{width:112px;height:112px;border-radius:26px;box-shadow:0 20px 60px rgba(168,85,247,.45)}
h1{margin:26px 0 6px;font-size:86px;font-weight:900;letter-spacing:1px;background:linear-gradient(90deg,#818cf8,#e879f9);-webkit-background-clip:text;color:transparent;line-height:1}
p{margin:10px 0 0;color:#cbd5e1;font-size:28px;line-height:1.35}
.pills{margin-top:30px;display:flex;gap:10px}
.pill{padding:7px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:#e2e8f0;font-size:17px}
.fan{position:absolute;right:40px;top:70px;width:640px;height:520px}
.fan img{position:absolute;width:210px;height:315px;border-radius:14px;box-shadow:0 25px 60px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08);object-fit:cover}
</style></head><body><div class="bg"></div>

<img src="out/media/covers/g08.svg" style="left:20px;top:120px;transform:rotate(-16deg)">
