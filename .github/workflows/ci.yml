# Проверка на каждый push/PR на трёх ОС: сборка фронтенда, go vet и тесты.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-24.04
            tags: webkit2_41          # Wails на Ubuntu 24.04 собирается с WebKitGTK 4.1
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: game-launcher
    env:
      GOFLAGS: ${{ matrix.tags && format('-tags={0}', matrix.tags) || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: game-launcher/go.mod
          cache-dependency-path: game-launcher/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: game-launcher/frontend/package-lock.json

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      # frontend/dist встраивается в бинарник (go:embed) — без него Go не соберётся
      - name: Frontend build
        working-directory: game-launcher/frontend
        run: |
          npm ci
          npm run build

      - name: Go vet
        run: go vet ./...

      # Логи Actions видны только после входа в GitHub, а аннотации отдаются публичным API,
      # поэтому при падении выносим упавшие тесты в аннотацию ::error.
      - name: Go test
        run: |
          if go test ./... > go-test.log 2>&1; then
            cat go-test.log
            exit 0
          fi
          cat go-test.log
          msg=$(grep -E -B2 -A15 -- '--- FAIL|^panic:|build failed|^FAIL' go-test.log | head -80 \
            | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=go test failed::${msg:-see job log}"
          exit 1
