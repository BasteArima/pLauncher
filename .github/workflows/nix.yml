# Сборка Nix-пакета (flake.nix) и проверка, что лаунчер запускается и держит окно.
# Ошибки (в т.ч. «hash mismatch … got: sha256-…») выносятся в аннотации — их видно без входа в GitHub.
name: Nix

on:
  push:
    branches: [main]
    paths: ['flake.nix', 'flake.lock', 'game-launcher/**', '.github/workflows/nix.yml']
  pull_request:
    paths: ['flake.nix', 'flake.lock', 'game-launcher/**', '.github/workflows/nix.yml']
  workflow_dispatch:

jobs:
  build:
    # Обычный Nix и Determinate Nix (у него «ленивые» деревья исходников — другое поведение flake)
    strategy:
      fail-fast: false
      matrix:
        nix: [upstream, determinate]
    name: build (${{ matrix.nix }} nix)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - if: matrix.nix == 'upstream'
        uses: cachix/install-nix-action@v31
      - if: matrix.nix == 'determinate'
        uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true

      - name: Lock
        run: |
          if [ ! -f flake.lock ]; then
            nix flake lock
            echo "::notice title=flake.lock is missing, commit this::$(jq -c . flake.lock)"
          fi

      - name: Version matches wails.json
        run: |
          flake=$(nix eval --raw .#packages.x86_64-linux.default.version)
          wails=$(jq -r .info.productVersion game-launcher/wails.json)
          if [ "$flake" != "$wails" ]; then
            echo "::error title=flake.nix version is out of date::flake.nix has $flake, wails.json has $wails"
            exit 1
          fi

      # При пуше собираем так же, как пользователь: через github:<репозиторий>/<коммит>
      - name: Build
        run: |
          ref=.#default
          if [ "$GITHUB_EVENT_NAME" = push ]; then ref="github:$GITHUB_REPOSITORY/$GITHUB_SHA#default"; fi
          echo "building $ref"
          if nix build "$ref" -L --keep-going > nix.log 2>&1; then tail -n 20 nix.log; exit 0; fi
          tail -n 200 nix.log
          msg=$(grep -E -A3 'hash mismatch|error:' nix.log | head -40 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=nix build failed (${{ matrix.nix }})::${msg:-see job log}"
          exit 1

      # Лаунчер запускается под Xvfb с программным OpenGL (Mesa): окно должно продержаться 30 с
      # и нарисовать интерфейс (много цветов на скриншоте), а не пустую серую область.
      - name: Smoke test (window renders)
        run: |
          NIXS="nix shell --inputs-from ."
          MESA=$(nix build --inputs-from . --no-link --print-out-paths nixpkgs#mesa | head -1)
          $NIXS nixpkgs#xorg-server nixpkgs#dbus nixpkgs#imagemagick -c bash -c "
            Xvfb :99 -screen 0 1280x800x24 > /dev/null 2>&1 &
            sleep 2; export DISPLAY=:99 HOME=\$RUNNER_TEMP/home; mkdir -p \$HOME
            export __EGL_VENDOR_LIBRARY_DIRS=$MESA/share/glvnd/egl_vendor.d LIBGL_DRIVERS_PATH=$MESA/lib/dri LIBGL_ALWAYS_SOFTWARE=1
            CONF=\$(dirname \$(command -v dbus-daemon))/../share/dbus-1/session.conf
            dbus-run-session --config-file=\$CONF -- timeout 30 ./result/bin/pLauncher > run.log 2>&1 &
            sleep 20; import -window root shot.png
            wait %2; echo \$? > exit.code
            magick shot.png -format '%k' info: > colors.txt
          "
          code=$(cat exit.code); colors=$(cat colors.txt)
          echo "exit=$code colors=$colors"; cat run.log
          if [ "$code" != "124" ] || [ "$colors" -lt 200 ]; then
            msg=$(tail -n 30 run.log | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=pLauncher didn't render (exit $code, $colors colors)::${msg:-no output}"
            exit 1
          fi
