name: Feature request
description: An idea to make pLauncher better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or the situation, not only the solution.
      placeholder: I have 300 games and I keep forgetting which ones I've finished…
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could pLauncher help?
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you tried or seen elsewhere?
