# Обновления зависимостей раз в неделю, мелкие версии одним PR на экосистему.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /game-launcher
    schedule:
      interval: weekly
    groups:
      go:
        update-types: [minor, patch]
    ignore:
      # Wails обновляем вручную вместе с CLI (версии модуля и CLI должны совпадать) и проверкой сборки
      - dependency-name: "github.com/wailsapp/wails/v2"

  # Фронтенд на Svelte 3 / Vite / Tailwind 3: мажорные версии ломают сборку, их обновляем вручную
  - package-ecosystem: npm
    directory: /game-launcher/frontend
    schedule:
      interval: weekly
    groups:
      frontend:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
